<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hey Jim">
<meta name="theme-color" content="#EFEBE4">
<title>Hey Jim</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="lock" class="lock" hidden>
  <div class="lock-inner">
    <div class="lock-logo"><img src="icon-192.png" alt=""></div>
    <h1>Hey Jim</h1>
    <p class="muted">Enter the password once. This device stays unlocked.</p>
    <form id="lockForm" autocomplete="on">
      <input type="text" name="username" value="jim" autocomplete="username" hidden>
      <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" name="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary big" type="submit">Unlock</button>
    </form>
    <p id="lockMsg" class="lock-msg"></p>
    <p id="a2hs" class="muted small" hidden>Tip: in Safari tap Share → <b>Add to Home Screen</b> so it opens like an app.</p>
  </div>
</div>

<div id="app" hidden>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
    <button data-tab="places"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Places</span></button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Week</span></button>
  </nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" id="sheet"><div class="sheet-grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
